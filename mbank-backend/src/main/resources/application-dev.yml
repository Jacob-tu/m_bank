# ================================================================
# application-dev.yml - 开发环境配置
# 本地开发专用，允许明文配置，禁止用于生产
# ================================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mbank?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 开发环境可以 update（方便调试）
      ddl-auto: validate
    # 开发环境打印 SQL（调试用）
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Actuator：开发环境暴露所有端点
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

mbank:
  jwt:
    secret: bXliYW5rLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=
    expiration-hours: 24
  security:
    max-login-attempts: 5
    lock-duration-minutes: 15
  sms:
    # 开发环境开启 Mock，短信验证码固定为 123456
    mock-enabled: true
    valid-code: "123456"

# 日志配置（开发环境）
logging:
  level:
    root: INFO
    com.mbank: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
