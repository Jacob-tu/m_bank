spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mbank?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mbank:
  jwt:
    # Base64 编码的 256 位密钥（生产环境请替换）
    secret: bXliYW5rLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=
    expiration-hours: 24
  security:
    max-login-attempts: 5
    lock-duration-minutes: 15
  sms:
    mock-enabled: true
    valid-code: "123456"
