# ================================================================
# M-Bank Nginx 配置
# 功能：
#   - /api/* 反向代理到 Spring Boot 后端（8080）
#   - /* 前端静态资源服务（Vue3 构建产物）
#   - Gzip 压缩
#   - 安全响应头
#   - 请求限流（防暴力破解）
# ================================================================

# 请求限流区：针对认证接口防暴力破解（每个 IP 每秒最多 5 次）
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ---- 安全响应头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：允许同源，禁止内联脚本（生产环境按需调整）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # ---- 认证接口：限流 + 反向代理 ----
    location /api/v1/auth/ {
        # 限流：突发允许 10 个请求排队，超出立即返回 429
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---- 其他 API 接口：反向代理到后端 ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ---- Spring Boot Actuator（仅内网访问） ----
    location /actuator/ {
        # 生产环境只允许内网访问，外部请求返回 403
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # ---- 前端静态资源（Vue3 构建产物）----
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # 支持 Vue Router history 模式（404 回退到 index.html）
        try_files $uri $uri/ /index.html;

        # JS/CSS/图片：缓存 1 年（文件名含 hash，内容不变）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---- 屏蔽敏感路径 ----
    location ~ /\. {
        deny all;
    }

    # ---- 错误页 ----
    error_page 404 /index.html;
    error_page 429 @too_many_requests;
    error_page 500 502 503 504 /50x.html;

    location @too_many_requests {
        default_type application/json;
        return 429 '{"code":429,"message":"请求过于频繁，请稍后再试","data":null}';
    }

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
