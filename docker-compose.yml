# ================================================================
# M-Bank Docker Compose 编排文件
# 包含：backend (Spring Boot) + mysql (MySQL 8.0) + nginx (反向代理)
#
# 使用方式：
#   开发环境：docker compose up -d
#   停止：     docker compose down
#   停止并清理数据：docker compose down -v
# ================================================================

services:

  # ---- MySQL 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: mbank-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MBank@Root2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mbank}
      MYSQL_USER: ${MYSQL_USER:-mbank}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-MBank@Pass2024}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mbank-backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mbank-net
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-time-zone=+08:00
      --max-connections=200
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-MBank@Root2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Spring Boot 后端 ----
  backend:
    build:
      context: ./mbank-backend
      dockerfile: Dockerfile
    container_name: mbank-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 数据库连接
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mbank}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-mbank}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-MBank@Pass2024}
      # JWT 配置（生产环境必须替换密钥）
      MBANK_JWT_SECRET: ${MBANK_JWT_SECRET:-bXliYW5rLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=}
      MBANK_JWT_EXPIRATION_HOURS: ${MBANK_JWT_EXPIRATION_HOURS:-24}
      # 安全策略
      MBANK_SECURITY_MAX_LOGIN_ATTEMPTS: ${MBANK_SECURITY_MAX_LOGIN_ATTEMPTS:-5}
      MBANK_SECURITY_LOCK_DURATION_MINUTES: ${MBANK_SECURITY_LOCK_DURATION_MINUTES:-15}
      # SMS（生产环境关闭 Mock）
      MBANK_SMS_MOCK_ENABLED: ${MBANK_SMS_MOCK_ENABLED:-false}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - mbank-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---- Nginx 反向代理 ----
  nginx:
    image: nginx:1.25-alpine
    container_name: mbank-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - mbank-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# ---- 持久化卷 ----
volumes:
  mysql_data:
    driver: local

# ---- 内部网络 ----
networks:
  mbank-net:
    driver: bridge
